services:
  postgres:
    container_name: flowpilot_postgres
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flowpilot_db
      POSTGRES_USER: flowpilot_user
      POSTGRES_PASSWORD: flowpilot_password
    volumes:
      - flowpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpilot_user -d flowpilot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  flowpilot_postgres_data:
